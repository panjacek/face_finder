x-app-base: &app_base
  image: face_finder:last
  volumes:
    - ${PWD}:/app
  user: ${UID:-1000}

services:
  face_finder:
    <<: *app_base
    build: .
    command: "face_finder --log_lvl=DEBUG ${IMAGES:-}"

  face_finder_gpu:
    <<: *app_base
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  face_finder_web:
    <<: *app_base
    ports:
      - "8080:8501"
    command: "streamlit run src/web_app/app.py"
