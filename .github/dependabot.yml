version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # mediapipe 1.x = Tasks API rewrite, needs core.py migration (see docs/plans)
      - dependency-name: "mediapipe"
