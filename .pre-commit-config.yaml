repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --group dev --group web mypy src tests
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run --group dev bandit -q -r src
        language: system
        pass_filenames: false
